name: Phase 10 Mobile Upload Verify

on:
  workflow_dispatch:
  push:
    branches:
      - phase10-mobile-upload-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APP_FIELD_ENCRYPTION_KEY: ${{ secrets.APP_FIELD_ENCRYPTION_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PRODUCTION_URL: https://aria-ai-agent-vert.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secret presence
        shell: bash
        run: |
          for name in DATABASE_URL DIRECT_URL APP_FIELD_ENCRYPTION_KEY NEXTAUTH_SECRET CRON_SECRET; do
            if [ -n "${!name}" ]; then
              echo "${name}: present"
            else
              echo "${name}: missing"
            fi
          done

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma migrate status
        run: npx prisma migrate status

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Mobile upload readiness
        run: npx tsx scripts/mobile-upload-readiness.ts

      - name: Push notification readiness
        run: npx tsx scripts/push-notification-readiness.ts

      - name: Client portal auth readiness
        run: npx tsx scripts/client-portal-auth-readiness.ts

      - name: Client portal experience readiness
        run: npx tsx scripts/client-portal-experience-readiness.ts

      - name: Platform admin readiness
        run: npx tsx scripts/platform-admin-readiness.ts

      - name: Production security validation
        run: npx tsx scripts/production-security-validation.ts

      - name: Capture mobile upload screenshots
        run: npx tsx scripts/capture-mobile-upload-screenshots.ts

      - name: Upload mobile upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-upload-proof
          path: docs/demo/mobile-upload-proof
          if-no-files-found: error
