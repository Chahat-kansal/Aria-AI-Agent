name: Phase 11 Offline Tasks Verify

on:
  workflow_dispatch:
  push:
    branches:
      - phase11-offline-tasks-verify

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APP_FIELD_ENCRYPTION_KEY: ${{ secrets.APP_FIELD_ENCRYPTION_KEY }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PRODUCTION_URL: https://aria-ai-agent-vert.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Secret presence
        run: |
          for name in DATABASE_URL DIRECT_URL APP_FIELD_ENCRYPTION_KEY NEXTAUTH_SECRET CRON_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name: present"
            else
              echo "$name: missing"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Prisma migrate status
        run: npx prisma migrate status

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Offline readiness
        run: npx tsx scripts/offline-notes-tasks-readiness.ts

      - name: Push readiness
        run: npx tsx scripts/push-notification-readiness.ts

      - name: Platform admin readiness
        run: npx tsx scripts/platform-admin-readiness.ts

      - name: Production security validation
        run: npx tsx scripts/production-security-validation.ts
